name: MVIExample
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

packages:
  MVIExampleKit:
    path: .

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    dependencies:
      - package: MVIExampleKit
        product: Domain
      - package: MVIExampleKit
        product: Data
      - package: MVIExampleKit
        product: Presentation
    # Explicit Info.plist (generated by XcodeGen) instead of GENERATE_INFOPLIST_FILE,
    # because registering a custom URL scheme needs CFBundleURLTypes — an array,
    # not a scalar INFOPLIST_KEY_.
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: MVI Example
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.example.mviexample
            CFBundleURLSchemes: [mviexample]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mviexample
        PRODUCT_NAME: MVIExample
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
