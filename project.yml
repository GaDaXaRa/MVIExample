name: MVIExample
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  MVIExampleKit:
    path: .

targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    dependencies:
      - package: MVIExampleKit
        product: Domain
      - package: MVIExampleKit
        product: Data
      - package: MVIExampleKit
        product: Presentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.mviexample
        PRODUCT_NAME: MVIExample
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MVI Example
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
